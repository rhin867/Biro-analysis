<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biro-Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      min-height: 400px;
      background: #0F172A;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, rgba(37,99,235,0.2), rgba(124,58,237,0.2));
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-text h1 { font-size: 13px; font-weight: 700; }
    .header-text p { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      margin-left: auto;
      animation: pulse 2s infinite;
    }
    .status-dot.idle { background: rgba(255,255,255,0.2); animation: none; }
    .status-dot.recording { background: #EF4444; }
    .status-dot.ready { background: #10B981; }

    .body { padding: 14px 16px; }

    /* Session status */
    .session-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .session-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .session-value { font-size: 13px; font-weight: 600; }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .metric-val { font-size: 17px; font-weight: 800; }
    .metric-key { font-size: 9px; color: rgba(255,255,255,0.35); margin-top: 2px; }

    /* Level indicator */
    .levels {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
    }
    .level-pill {
      flex: 1;
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: default;
    }
    .level-pill.active { background: rgba(37,99,235,0.25); border-color: rgba(37,99,235,0.5); color: #60A5FA; }
    .level-pill.inactive { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.25); }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      color: white;
      box-shadow: 0 0 20px rgba(37,99,235,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(37,99,235,0.5); }
    .btn-danger {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #F87171;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); }

    /* Test name input */
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: white;
      outline: none;
      margin-bottom: 8px;
    }
    input[type="text"]:focus {
      border-color: rgba(37,99,235,0.5);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
    }
    input::placeholder { color: rgba(255,255,255,0.25); }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-link {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      text-decoration: none;
    }
    .footer-link:hover { color: rgba(255,255,255,0.6); }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🎯</div>
  <div class="header-text">
    <h1>Biro-Analysis</h1>
    <p>JEE · NEET Tracker</p>
  </div>
  <div class="status-dot idle" id="statusDot"></div>
</div>

<div class="body">

  <!-- Idle State -->
  <div id="idleView">
    <div class="session-card">
      <div class="session-label">Test Name</div>
      <input type="text" id="testNameInput" placeholder="e.g. JEE Mock #13 · Allen" />
      <div class="session-label">Tracking Level</div>
      <div class="levels" id="levelIndicator">
        <div class="level-pill active">L1 Widget</div>
        <div class="level-pill inactive">L2 Ghost</div>
        <div class="level-pill inactive">L3 Mirror</div>
        <div class="level-pill inactive">L4 Coords</div>
      </div>
    </div>

    <button class="btn btn-primary" id="startBtn">▶ Start Recording</button>
    <button class="btn btn-secondary" id="openDashboardBtn">📊 Open Dashboard</button>
  </div>

  <!-- Recording State -->
  <div id="recordingView" style="display:none;">
    <div class="session-card" style="border-color:rgba(239,68,68,0.25);">
      <div class="session-label" style="color:#F87171;">● RECORDING ACTIVE</div>
      <div class="session-value" id="recordingTestName">-</div>
    </div>

    <div class="metrics-grid">
      <div class="metric">
        <div class="metric-val" style="color:#60A5FA;" id="elapsedTime">00:00</div>
        <div class="metric-key">Elapsed</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:#34D399;" id="eventCount">0</div>
        <div class="metric-key">Events</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:#A78BFA;" id="qCount">0</div>
        <div class="metric-key">Questions</div>
      </div>
    </div>

    <button class="btn btn-danger" id="stopBtn">⏹ Stop & Analyze</button>
    <button class="btn btn-secondary" id="pauseBtn">⏸ Pause</button>
  </div>

</div>

<div class="footer">
  <a class="footer-link" id="settingsLink">⚙ Settings</a>
  <a class="footer-link" id="helpLink">? Help</a>
  <span style="font-size:9px;color:rgba(255,255,255,0.15);">v1.0.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
